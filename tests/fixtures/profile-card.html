<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      font-family: Tahoma, sans-serif;
    }
    .card {
      width: 320px;
      max-width: 90%;
      padding: 30px;
      text-align: center;
      background: #1e293b;
      color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px #0005;
    }
    h2 { margin-bottom: 8px; }
    p { color: #94a3b8; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #2563eb;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>محمد جمشیدی</h2>
    <p>Frontend Developer</p>
    <button>مشاهده پروفایل</button>
  </div>
</body>
</html>
