[package]
name = "renderift"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "renderift_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "renderift"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
walkdir = "2"
globset = "0.4"
notify = "8"
mime_guess = "2"
tiny_http = "0.12"
percent-encoding = "2"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }
