name: Verify and package
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix examples/react-vite && npm ci --prefix examples/vue-vite
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            test-results
            docs/screenshots
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: npm ci --prefix examples/react-vite && npm ci --prefix examples/vue-vite
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features modern_vite_workflows -- --ignored
  windows:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis,msi
      - name: Package portable distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/portable | Out-Null
          Copy-Item src-tauri/target/release/live-editor.exe release/portable/live-editor.exe
          Copy-Item LICENSE,docs/PORTABLE.md release/portable/
          Compress-Archive release/portable/* release/Live-Editor_1.0.0_x64_portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Get-ChildItem release -File | ForEach-Object { $hash=Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS-Windows-x64.txt
      - name: Desktop launch smoke and measurements
        shell: pwsh
        run: |
          $timer=[Diagnostics.Stopwatch]::StartNew()
          $process=Start-Process release/portable/live-editor.exe -PassThru
          try {
            $ready=$false
            for($i=0;$i -lt 100;$i++) { Start-Sleep -Milliseconds 100; $process.Refresh(); if($process.HasExited) { throw 'Desktop exited during launch' }; if($process.MainWindowHandle -ne 0) { $ready=$true; break } }
            if(-not $ready) { throw 'Desktop window did not open within 10 seconds' }
            $timer.Stop()
            "Window-visible startup ms: $($timer.ElapsedMilliseconds)" | Set-Content release/SMOKE-Windows-x64.txt
            "Parent process working set bytes: $($process.WorkingSet64) (excludes WebView2 children)" | Add-Content release/SMOKE-Windows-x64.txt
            Get-ChildItem release -File | Select-Object Name,Length | Out-String | Add-Content release/SMOKE-Windows-x64.txt
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Editor-Windows-x64
          path: release/*.*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    needs: [frontend, rust]
    env:
      CARGO_BUILD_JOBS: 2
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11 webkit2gtk-driver
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles deb,appimage
      - run: cargo install tauri-driver --locked
      - name: Exercise packaged Linux application and native boundary
        run: dbus-run-session -- xvfb-run -a python3 scripts/native-smoke.py --binary src-tauri/target/release/live-editor --output release
      - name: Collect Linux packages and checksums
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cd release
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS-Linux-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Editor-Linux-x64
          path: release/*
          if-no-files-found: error
      - name: Preserve Linux smoke diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: Linux-smoke-diagnostics
          path: |
            release/*.log
            release/*.json
            release/*.png
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Live-Editor-*-x64
          merge-multiple: true
          path: release
      - name: Prepare draft release from passing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --title "Live Editor $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
