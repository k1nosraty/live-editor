name: Verify and package
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix examples/react-vite && npm ci --prefix examples/vue-vite
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            test-results
            docs/screenshots
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: npm ci --prefix examples/react-vite && npm ci --prefix examples/vue-vite
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features modern_vite_workflows -- --ignored
  windows:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis,msi
      - name: Package portable distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/portable | Out-Null
          Copy-Item src-tauri/target/release/renderift.exe release/portable/Renderift.exe
          Copy-Item LICENSE,docs/PORTABLE.md release/portable/
          Compress-Archive release/portable/* release/Renderift_1.0.0_x64_portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Get-ChildItem release -File | ForEach-Object { $hash=Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - name: Desktop launch smoke and measurements
        shell: pwsh
        run: |
          $timer=[Diagnostics.Stopwatch]::StartNew()
          $process=Start-Process release/portable/Renderift.exe -PassThru
          try {
            $ready=$false
            for($i=0;$i -lt 100;$i++) { Start-Sleep -Milliseconds 100; $process.Refresh(); if($process.HasExited) { throw 'Desktop exited during launch' }; if($process.MainWindowHandle -ne 0) { $ready=$true; break } }
            if(-not $ready) { throw 'Desktop window did not open within 10 seconds' }
            $timer.Stop()
            "Window-visible startup ms: $($timer.ElapsedMilliseconds)" | Set-Content release/SMOKE-RESULTS.txt
            "Parent process working set bytes: $($process.WorkingSet64) (excludes WebView2 children)" | Add-Content release/SMOKE-RESULTS.txt
            Get-ChildItem release -File | Select-Object Name,Length | Out-String | Add-Content release/SMOKE-RESULTS.txt
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Renderift-Windows-x64
          path: release/*.*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Renderift-Windows-x64
          path: release
      - name: Prepare draft release from passing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --title "Renderift $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
